name: Release Check

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check NAVER authentication boundary
        run: node --experimental-strip-types --test scripts/naver-auth.test.mjs scripts/naver-profile.test.mjs

      - name: Check Excel budget export
        run: node --experimental-strip-types --test scripts/excel-budget-export.test.mjs

      - name: Typecheck, lint, and build
        run: npm run check

      - name: Audit production dependencies
        run: npm run audit:prod
