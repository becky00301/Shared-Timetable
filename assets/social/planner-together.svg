<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#243044" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="calendarClip">
      <rect x="135" y="410" width="930" height="430" rx="34"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>

  <g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" text-anchor="middle">
    <text x="600" y="54" fill="#717788" font-size="25" font-weight="700" letter-spacing="3">플래너 투게더</text>
    <text x="600" y="153" fill="#a3a9b4" font-size="88" font-weight="800" letter-spacing="-4">함께 만드는</text>
    <text x="600" y="247" fill="#101317" font-size="88" font-weight="800" letter-spacing="-4">공유 시간표</text>
    <text x="600" y="300" fill="#717788" font-size="28" font-weight="500" letter-spacing="-0.7">드래그로 만들고, 링크 하나로 공유하세요.</text>
    <rect x="486" y="328" width="228" height="56" rx="28" fill="#8c4249"/>
    <text x="600" y="365" fill="#ffffff" font-size="23" font-weight="700">무료로 시작하기</text>
  </g>

  <g transform="rotate(-2 600 620)">
    <rect x="135" y="410" width="930" height="430" rx="34" fill="#ffffff" stroke="#e1e4e9" stroke-width="2" filter="url(#shadow)"/>
    <g clip-path="url(#calendarClip)">
      <rect x="135" y="410" width="930" height="64" fill="#eeeff2"/>
      <g stroke="#edf0f3" stroke-width="2">
        <path d="M198 474V840 M487 474V840 M776 474V840"/>
        <path d="M198 543H1065 M198 612H1065 M198 681H1065 M198 750H1065 M198 819H1065"/>
      </g>
      <g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" text-anchor="middle" fill="#657083" font-size="23" font-weight="600">
        <text x="343" y="450">월</text>
        <text x="632" y="450">화</text>
        <text x="921" y="450">수</text>
      </g>
      <g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" fill="#929baa" font-size="18">
        <text x="158" y="510">09</text>
        <text x="158" y="580">11</text>
        <text x="158" y="649">13</text>
        <text x="158" y="718">15</text>
        <text x="158" y="787">17</text>
      </g>

      <rect x="210" y="490" width="265" height="116" rx="9" fill="#bdd2f0"/>
      <rect x="789" y="552" width="264" height="132" rx="9" fill="#efd69e"/>
      <rect x="500" y="661" width="263" height="90" rx="9" fill="#c8ded1"/>
      <g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="23" font-weight="700">
        <text x="226" y="524" fill="#244e83">출발</text>
        <text x="806" y="586" fill="#785826">저녁</text>
        <text x="518" y="695" fill="#3f6654">같이 산책</text>
      </g>

      <g transform="translate(623 570)" fill="#b88cd5">
        <path d="M0 0 22 7 12 12 8 23Z" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
        <rect x="30" y="-1" width="59" height="31" rx="15.5"/>
        <text x="59.5" y="21" text-anchor="middle" fill="#ffffff" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="700">민지</text>
      </g>
      <g transform="translate(918 508)" fill="#8c4249">
        <path d="M0 0 22 7 12 12 8 23Z" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
        <rect x="30" y="-1" width="39" height="31" rx="15.5"/>
        <text x="49.5" y="21" text-anchor="middle" fill="#ffffff" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="700">나</text>
      </g>
    </g>
